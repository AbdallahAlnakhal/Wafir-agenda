<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3B67">
<title>جدول ورشة وافر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: mirrors the official printed agenda — brand stripe, partner emblems on the edges, centered title, navy table head, tinted numbered rows, info footer, compact initiative card. Bilingual (AR/EN) with logical properties so RTL/LTR mirror cleanly. Single light look by design. */
:root{
  color-scheme:light;
  --navy:#0F3B67; --teal:#0E8F8A; --green:#2EAF7A; --gold:#D4A64B;
  --bg:#FFFFFF; --page:#F4F7F9; --fg:#0F3B67; --muted:#5E6E7E; --line:#E1E8EE;
  --t-teal:#E8F5F5; --t-green:#EAF6F0; --t-gold:#FAF4EA; --t-navy:#E8EDF2;
  --font:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;
  --cols:72px 170px minmax(0,1fr) 160px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--page);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}

.sheet{max-width:1100px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:0 0 0 1px var(--line)}
.stripe{display:flex;height:8px}
.stripe i{flex:1}
.inner{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));padding-block:14px 26px}

/* language switch */
.langbar{display:flex;justify-content:flex-end;margin-bottom:6px}
.lang{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.9rem;font-weight:800;color:var(--navy);background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:5px 14px 5px 12px;cursor:pointer;transition:border-color .2s,background .2s}
.lang:hover{border-color:var(--teal);background:var(--t-teal)}
.lang:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.lang svg{width:18px;height:18px;color:var(--teal)}

/* header */
.head{display:grid;grid-template-columns:170px minmax(0,1fr) 170px;grid-template-areas:"r t l";align-items:center;gap:16px;margin:0 0 22px}
.org{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.org img{height:100px;width:auto;display:block}
.org figcaption{font-size:.8rem;font-weight:700;color:var(--navy);line-height:1.35}
.org-r{grid-area:r}.org-l{grid-area:l}
.title{grid-area:t;text-align:center}
h1,.sub{margin:0 auto;font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800;line-height:1.45;text-wrap:balance;color:var(--fg)}
.sub{margin-top:2px}
.en{margin:6px 0 0;color:var(--muted);font-size:.85rem;direction:ltr}
.rule{width:96px;height:3px;border-radius:2px;background:var(--gold);margin:12px auto 0}

/* table */
.thead{display:grid;grid-template-columns:var(--cols);align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:12px 0;font-weight:700;font-size:1.05rem;text-align:center}
.rows{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.row{--c:var(--teal);--t:var(--t-teal);display:grid;grid-template-columns:var(--cols);align-items:center;min-height:72px;background:var(--t);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);border-inline-start:5px solid var(--c);border-radius:14px;transition:box-shadow .2s,transform .2s}
.row.c-green{--c:var(--green);--t:var(--t-green)}
.row.c-gold{--c:var(--gold);--t:var(--t-gold)}
.row.c-navy{--c:var(--navy);--t:var(--t-navy)}
.n{justify-self:center;width:36px;height:36px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;font-size:1.05rem}
.time{text-align:center;font-weight:800;font-size:1.35rem;white-space:nowrap}
.session{padding-block:10px;padding-inline:12px 18px;min-width:0}
.session h3{margin:0;font-size:1.18rem;font-weight:700;line-height:1.5}
.session p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.speaker{text-align:center;font-weight:700;padding-inline:10px}
.dur{display:inline-block;background:#fff;border:1px solid color-mix(in srgb,var(--c) 30%,transparent);font-weight:700;font-size:.95rem;padding:4px 14px;border-radius:999px;white-space:nowrap}
.now-tag{display:none;margin-top:6px;align-items:center;gap:6px;font-size:.8rem;font-weight:800;color:#167F55}
.now-tag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,175,122,.55)}70%{box-shadow:0 0 0 8px rgba(46,175,122,0)}100%{box-shadow:0 0 0 0 rgba(46,175,122,0)}}
.row.now{box-shadow:0 0 0 2px var(--green),0 8px 22px -10px rgba(15,59,103,.35)}
.row.now .now-tag{display:inline-flex}
@media (hover:hover){.row:hover{transform:translateY(-1px);box-shadow:0 8px 22px -12px rgba(15,59,103,.35)}}

/* survey buttons */
.surveys{margin:0 0 8px}
.sv-head{margin:0 0 12px;text-align:center;font-size:clamp(1.2rem,2.8vw,1.5rem);font-weight:800;line-height:1.45;color:var(--navy);text-wrap:balance}
.sv-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sv{--c:var(--navy);position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;padding:16px 18px;border-radius:18px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 70%,#000));box-shadow:0 14px 28px -16px color-mix(in srgb,var(--c) 85%,transparent);transition:transform .2s,box-shadow .2s;overflow:hidden}
.sv::after{content:"";position:absolute;inset-block:-40%;inset-inline-end:-30px;width:120px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.sv.uni{--c:#0F3B67}
.sv.biz{--c:#0E8F8A}
.sv:hover{transform:translateY(-2px);box-shadow:0 18px 32px -16px color-mix(in srgb,var(--c) 90%,transparent)}
.sv:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sv-ic{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center;flex:none}
.sv-ic svg{width:28px;height:28px}
.sv-t{min-width:0}
.sv-t b{display:block;font-size:1.15rem;font-weight:800;line-height:1.35}
.sv-t small{display:block;font-size:.85rem;opacity:.85;margin-top:2px}
.sv-go{width:36px;height:36px;border-radius:50%;background:var(--gold);color:#0F2E4A;display:grid;place-items:center;flex:none}
.sv-go svg{width:18px;height:18px}
html[dir="rtl"] .sv-go svg{transform:scaleX(-1)}

/* section headings */
.sec{display:flex;align-items:center;gap:10px;margin:30px 0 12px;font-size:1.3rem;font-weight:800;color:var(--navy)}
.sec::before{content:"";width:6px;height:26px;border-radius:3px;background:var(--gold);flex:none}
.sec small{font-size:.95rem;font-weight:700;color:var(--teal)}

.goto{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:.85rem;font-weight:700;color:var(--teal);text-decoration:none;background:#fff;border:1px solid color-mix(in srgb,var(--teal) 30%,transparent);border-radius:999px;padding:2px 12px}
.goto:hover{background:var(--t-teal)}

/* panel axes */
.panel{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff}
.panel .thead{border-radius:0}
.axes{list-style:none;margin:0;padding:0}
.ax{display:grid;grid-template-columns:var(--cols);align-items:center;min-height:58px;border-top:1px solid var(--line);border-inline-start:4px solid transparent}
.ax:nth-child(even){background:#F7FAFB}
.ax:first-child{border-top:0}
.ax .n{width:30px;height:30px;font-size:.9rem;background:var(--teal)}
.ax .time{font-size:1.15rem}
.ax .session h3{font-size:1.05rem;font-weight:600}
.ax .dur{--c:var(--teal)}
.ax.now{background:var(--t-green);border-inline-start-color:var(--green)}
.ax.now .now-tag{display:inline-flex}
.outcome{margin-top:12px;display:flex;gap:12px;align-items:flex-start;background:var(--t-gold);border:1px solid color-mix(in srgb,var(--gold) 35%,transparent);border-radius:16px;padding:14px 18px}
.outcome svg{width:24px;height:24px;flex:none;color:#A8791F;margin-top:2px}
.outcome b{color:#8A6420}
.outcome p{margin:0;font-size:1rem;line-height:1.75}

/* info footer */
.info{display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;border-top:3px solid var(--gold);margin-top:20px;padding-top:14px;font-weight:700;font-size:1.05rem}
.info b{color:var(--teal)}

/* initiative card */
.brand{position:relative;margin:26px auto 0;width:fit-content;max-width:100%;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:18px 22px;border-radius:18px;padding:16px 22px;background:#fff;border:1px solid var(--line);overflow:hidden}
.brand::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:linear-gradient(180deg,var(--navy),var(--teal),var(--green),var(--gold))}
.brand img{display:block;width:170px;height:auto}
.b-txt{min-width:0;border-inline-start:1px solid var(--line);padding-inline-start:22px}
.pill{display:inline-block;font-size:.72rem;font-weight:800;color:var(--teal);background:var(--t-teal);border-radius:999px;padding:1px 10px}
.b-ar{margin:6px 0 0;font-weight:700;color:var(--navy);font-size:.95rem;line-height:1.5}
.b-en{margin:2px 0 0;color:var(--muted);font-size:.78rem}
.b-sl{margin:6px 0 0;color:#1E9C6C;font-weight:800;font-size:.95rem}

/* English mode */
html[lang="en"] .en{display:none}
html[lang="en"] .b-ar{display:none}
html[lang="en"] .b-en{font-size:.95rem;font-weight:700;color:var(--navy);margin-top:6px}
html[lang="en"] h1,html[lang="en"] .sub{letter-spacing:-.005em}

/* phone */
@media (max-width:720px){
  .inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 22px}
  .langbar{margin-bottom:10px}
  .sv-grid{grid-template-columns:1fr;gap:10px}
  .sv{padding:14px 14px;gap:12px}
  .sv-ic{width:44px;height:44px}
  .sv-t b{font-size:1.05rem}
  .head{grid-template-columns:1fr 1fr;grid-template-areas:"r l" "t t";gap:14px 12px;margin-bottom:18px}
  .org img{height:72px}
  .org figcaption{font-size:.72rem}
  .org-r{justify-self:start}.org-l{justify-self:end}
  h1,.sub{font-size:1.45rem}
  html[lang="en"] h1,html[lang="en"] .sub{font-size:1.3rem}
  .thead,.panel .thead{display:none}
  .row,.ax{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"n time speaker" "n session session";align-items:start;column-gap:12px;min-height:0}
  .row{padding-block:14px;padding-inline:12px 14px}
  .ax{padding-block:12px;padding-inline:12px 14px}
  .n{grid-area:n;margin-top:2px}
  .time{grid-area:time;text-align:start;font-size:1.15rem;color:var(--c)}
  .row.c-gold .time{color:#A8791F}
  .ax .time{font-size:1.05rem;color:var(--teal)}
  .session{grid-area:session;padding:2px 0 0}
  .session h3{font-size:1.06rem}
  .ax .session h3{font-size:1rem}
  .speaker{grid-area:speaker;align-self:center;padding:0}
  .dur{font-size:.82rem;padding:2px 10px}
  .sec{font-size:1.15rem}
  .outcome{padding:12px 14px}
  .info{flex-direction:column;font-size:.98rem}
  .brand{width:auto;grid-template-columns:1fr;justify-items:center;text-align:center;padding:16px 14px;gap:12px}
  .brand img{width:150px}
  .b-txt{border-inline-start:0;padding-inline-start:0;border-top:1px solid var(--line);padding-top:10px;width:100%}
  .b-ar{font-size:.88rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  { start:"12:50", end:"13:00", ar:"تلخيص نقاط الاتفاق والمخرجات والتوصيات الأولية",             en:"Summary of Agreed Points, Outputs and Initial Recommendations" }
];

// نصوص الصفحة الثابتة
const T = {
  ar:{
    pageTitle:"جدول ورشة وافر", switchTo:"English", switchAria:"Switch to English",
    ministry:"وزارة الاقتصاد الوطني", chamber:"غرفة تجارة وصناعة محافظة غزة",
    altEmblem:"شعار دولة فلسطين", altChamber:"شعار غرفة تجارة وصناعة محافظة غزة",
    h1:"جدول أعمال ورشة", sub:"تكامل القوى العاملة والجامعات والمنشآت الاقتصادية من أجل التعافي",
    sec1:"أولًا: البرنامج العام للورشة", sec2:"ثانيًا: محاور الجلسة الحوارية", sec2small:"(120 دقيقة)",
    thTime:"الوقت", thSession:"اسم الجلسة / المحور", thTopic:"المحور", thDur:"المدة",
    outcomeL:"المخرج المستهدف:", outcome:"التوافق على الاحتياجات التدريبية وأدوار الشركاء وآليات الترشيح والتقييم، وتحديد أولويات تشغيل المبادرة وخطوات المتابعة.",
    dateL:"التاريخ:", date:'الأربعاء <span class="num">4/11/2026</span>',
    timeL:"الوقت:", time:'<span class="num">10:00</span>&nbsp;صباحًا&nbsp;–&nbsp;<span class="num">1:10</span>&nbsp;ظهرًا',
    placeL:"المكان:", place:"قاعة المؤتمرات – غرفة تجارة وصناعة محافظة غزة، السامر",
    orgL:"تنظيم:", org:"وزارة الاقتصاد الوطني بالشراكة مع الغرفة التجارية",
    svHead:"نسعد بتعبئة الاستبيان الخاص بالورشة", svUni:"استبيان الجامعات", svUniSub:"للجامعات والمؤسسات الأكاديمية", svBiz:"استبيان القطاع الخاص", svBizSub:"للشركات والمنشآت الاقتصادية",
    pill:"المبادرة", slogan:"كفاءات تتطور .. وفرص تتسع",
    now:"تجري الآن", goto:"عرض محاور الجلسة ↓",
    mins: d => d <= 10 ? `${d} دقائق` : `${d} دقيقة`
  },
  en:{
    pageTitle:"WAFIR Workshop Agenda", switchTo:"العربية", switchAria:"التبديل إلى العربية",
    ministry:"Ministry of National Economy", chamber:"Gaza Chamber of Commerce and Industry",
    altEmblem:"Emblem of the State of Palestine", altChamber:"Gaza Chamber of Commerce and Industry logo",
    h1:"Workshop Agenda", sub:"Integrating the Workforce, Universities and Economic Enterprises for Recovery",
    sec1:"1. General Workshop Program", sec2:"2. Panel Discussion Topics", sec2small:"(120 min)",
    thTime:"Time", thSession:"Session / Topic", thTopic:"Topic", thDur:"Duration",
    outcomeL:"Target outcome:", outcome:"Agreement on training needs, partner roles, and nomination and evaluation mechanisms, and setting the initiative's operating priorities and follow-up steps.",
    dateL:"Date:", date:'Wednesday, <span class="num">4 November 2026</span>',
    timeL:"Time:", time:'<span class="num">10:00 AM – 1:10 PM</span>',
    placeL:"Venue:", place:"Conference Hall – Gaza Chamber of Commerce and Industry, Al-Samer",
    orgL:"Organized by:", org:"Ministry of National Economy in partnership with the Chamber of Commerce",
    svHead:"We would be glad if you could fill out the workshop survey", svUni:"Universities Survey", svUniSub:"For universities and academic institutions", svBiz:"Private Sector Survey", svBizSub:"For companies and economic enterprises",
    pill:"The Initiative", slogan:"Growing Competencies .. Expanding Opportunities",
    now:"Now", goto:"View panel topics ↓",
    mins: d => `${d} min`
  }
};
/* ================================================================ */

const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60 + m; };
const h12 = t => { let [h,m] = t.split(":").map(Number); h = h % 12 || 12; return `${h}:${String(m).padStart(2,"0")}`; };
const at = t => { const [y,mo,d] = EVENT_DATE.split("-").map(Number); const [h,m] = t.split(":").map(Number); return Date.UTC(y, mo-1, d, h - TZ_OFFSET, m); };

function render(lang){
  const t = T[lang], root = document.documentElement;
  root.lang = lang; root.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = t.pageTitle;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t[el.dataset.i18n]);
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t[el.dataset.i18nHtml]);
  document.querySelectorAll("[data-i18n-alt]").forEach(el => el.alt = t[el.dataset.i18nAlt]);
  document.getElementById("lang-label").textContent = t.switchTo;
  document.getElementById("lang").setAttribute("aria-label", t.switchAria);
  document.getElementById("lang").lang = lang === "ar" ? "en" : "ar";

  document.getElementById("rows").innerHTML = AGENDA.map((it,i) => {
    const sub = lang === "ar" ? it.subAr : it.subEn;
    return `<li class="row c-${it.color}">
      <span class="n num">${i+1}</span>
      <div class="time"><span class="num">${h12(it.start)} – ${h12(it.end)}</span></div>
      <div class="session">
        <h3>${it[lang]}</h3>
        ${sub ? `<p>${sub}</p>` : ""}
        ${it.panel ? `<a class="goto" href="#panel">${t.goto}</a>` : ""}
        <span class="now-tag">${t.now}</span>
      </div>
      <div class="speaker"><span class="dur">${t.mins(toMin(it.end) - toMin(it.start))}</span></div>
    </li>`;
  }).join("");

  document.getElementById("axes").innerHTML = PANEL.map((it,i) => `
    <li class="ax">
      <span class="n num">${i+1}</span>
      <div class="time"><span class="num">${h12(it.start)} – ${h12(it.end)}</span></div>
      <div class="session"><h3>${it[lang]}</h3><span class="now-tag">${t.now}</span></div>
      <div class="speaker"><span class="dur">${t.mins(toMin(it.end) - toMin(it.start))}</span></div>
    </li>`).join("");
  tick();
}

function tick(){
  const now = Date.now(), on = it => now >= at(it.start) && now < at(it.end);
  document.querySelectorAll(".row").forEach((el,i) => el.classList.toggle("now", on(AGENDA[i])));
  document.querySelectorAll(".ax").forEach((el,i) => el.classList.toggle("now", on(PANEL[i])));
}

// اللغة: من الرابط (#en) أو آخر اختيار، والافتراضي عربي
let lang = "ar";
try { lang = localStorage.getItem("wafir-lang") || "ar"; } catch (e) {}
if (location.hash === "#en") lang = "en";
if (location.hash === "#ar") lang = "ar";
if (!T[lang]) lang = "ar";
render(lang);

document.getElementById("lang").addEventListener("click", () => {
  lang = lang === "ar" ? "en" : "ar";
  render(lang);
  try { localStorage.setItem("wafir-lang", lang); } catch (e) {}
});
setInterval(tick, 30000);
</script>
